{% extends "base.html" %}

{% block title %}Admin Login — Secure Access{% endblock %}

{% block content %}
<div class="glass-box" style="margin-top: 120px; max-width: 420px;">
    <h2>🔐 Admin Login</h2>
    <p class="subtitle">Secure administrative access</p>

    {% if error %}
    <div class="form-error visible" role="alert">
        {{ error | e }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" novalidate>
        {# SECURITY: CSRF Token #}
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required
                   placeholder="admin@example.com"
                   autocomplete="email"
                   pattern="[^\s@]+@[^\s@]+\.[^\s@]+">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   minlength="8">
        </div>

        {# SECURITY: Honeypot field (anti-bot) #}
        <div class="form-honeypot" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;">
            <input type="text" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
